name: Android Release (APK + AAB)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: bun install

      - name: Gerar pacote web embutido
        run: bun run mobile:web

      - name: Criar projeto Android
        run: bunx cap add android

      - name: Sincronizar Capacitor
        run: bunx cap sync android

      - name: Enxugar o pacote (R8, ABIs, idiomas)
        run: node scripts/android-slim.mjs

      - name: Restaurar keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Configurar assinatura
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-signing.mjs

      - name: Build do APK e do AAB (release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Tamanhos dos artefatos
        run: |
          ls -lh android/app/build/outputs/apk/release/ || true
          ls -lh android/app/build/outputs/bundle/release/ || true

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: onde-comer-hoje-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
