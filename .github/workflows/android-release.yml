name: Android Release (APK + AAB)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache de dependências (bun)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('scripts/android-slim.mjs', 'package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Instalar dependências
        run: bun install

      - name: Gerar pacote web embutido
        run: bun run mobile:web

      - name: Criar projeto Android
        run: bunx cap add android

      - name: Sincronizar Capacitor
        run: bunx cap sync android

      - name: Enxugar o pacote (R8, ABIs, idiomas)
        run: node scripts/android-slim.mjs

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "keystore restaurado"
          else
            echo "sem keystore: o release sairá sem assinatura"
          fi

      - name: Configurar assinatura
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-signing.mjs

      - name: Build do APK e do AAB (release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --build-cache --parallel --stacktrace

      - name: Guardar mapping do R8 (desofuscação de crashes)
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Tamanhos dos artefatos
        run: |
          ls -lh android/app/build/outputs/apk/release/ || true
          ls -lh android/app/build/outputs/bundle/release/ || true

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: onde-comer-hoje-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
