name: Android APK

on:
  push:
    branches:
      - main
      - "edit/**"
      - "feature/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache de dependências (bun)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('scripts/android-slim.mjs', 'package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Instalar dependências
        run: bun install

      - name: Gerar pacote web embutido
        run: bun run mobile:web

      - name: Criar projeto Android
        run: bunx cap add android

      - name: Sincronizar Capacitor
        run: bunx cap sync android

      - name: Enxugar o APK (R8, ABIs, idiomas)
        run: node scripts/android-slim.mjs

      - name: Build do APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Tamanho do APK
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: onde-comer-hoje-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error